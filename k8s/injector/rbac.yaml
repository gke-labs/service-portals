apiVersion: v1
kind: Namespace
metadata:
  name: service-portals
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal-injector
  namespace: service-portals
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portal-injector
rules:
- apiGroups: ["portals.gke.io"]
  resources: ["portalpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portal-injector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portal-injector
subjects:
- kind: ServiceAccount
  name: portal-injector
  namespace: service-portals
