# Reference manifest for the Service Portal Controller.
#
# Installation & Configuration:
# Install this manifest unchanged (for example with `ap deploy` or `kubectl apply -f k8s/controller.yaml`).
# Note: `ap deploy` automatically builds and sets the placeholder image, whereas a plain
# `kubectl apply` user must set the container "image" field to a published image.
# After deployment, configure the controller by creating a ConfigMap named
# "service-portal-config" in the "service-portal-system" namespace (for example
# using the helper script `dev/tasks/configure`).
# Until this ConfigMap exists, the controller pod does not start (remaining in
# CreateContainerConfigError), signaling that the installation is not yet configured.
#
# Namespace:
# All controller components are deployed into the "service-portal-system" namespace.
#
# TLS Certificate and Key:
# The controller serves gRPC over TLS. The serving certificate and private key
# come from a Kubernetes TLS Secret named "service-portal-controller-tls" that
# the deployer must supply in the "service-portal-system" namespace,
# containing "tls.crt" and "tls.key".
#
# Configuration Values (supplied via the "service-portal-config" ConfigMap):
# 1. audience:
#    The expected TokenReview audience used to authenticate incoming tokens from
#    clients and node agents. Defaults to the fixed value
#    "https://service-portal-controller" (configured by dev/tasks/configure),
#    matching the fixed projected token audience in k8s/node-agent.yaml.
#    It names the recipient of the token, is not a secret, and requires no
#    per-install configuration.
# 2. node-agent-account:
#    The Kubernetes service account identity of the node agent in
#    "system:serviceaccount:<namespace>:<name>" format (defaults to
#    "system:serviceaccount:service-portal-system:portal-node-agent" in
#    dev/tasks/configure, matching k8s/node-agent.yaml).
# 3. client-allowlist:
#    A comma-separated list of permitted client service accounts in
#    "system:serviceaccount:<namespace>:<name>" format
#    (e.g. "system:serviceaccount:default:sandbox-controller").
#    If empty (""), the controller starts with an empty allowlist and all client
#    calls are refused.

# Also declared in k8s/node-agent.yaml; the privileged label is needed by the node agent.
apiVersion: v1
kind: Namespace
metadata:
  name: service-portal-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-portal-controller
  namespace: service-portal-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: service-portal-controller
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: service-portal-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: service-portal-controller
subjects:
- kind: ServiceAccount
  name: service-portal-controller
  namespace: service-portal-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-portal-controller
  namespace: service-portal-system
  labels:
    app: service-portal-controller
spec:
  # One replica: node agents hold a stream to one instance.
  replicas: 1
  selector:
    matchLabels:
      app: service-portal-controller
  template:
    metadata:
      labels:
        app: service-portal-controller
    spec:
      serviceAccountName: service-portal-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: service-portal-controller
        image: service-portal-controller:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 8443
        env:
        - name: AUDIENCE
          valueFrom:
            configMapKeyRef:
              name: service-portal-config
              key: audience
        - name: NODE_AGENT_ACCOUNT
          valueFrom:
            configMapKeyRef:
              name: service-portal-config
              key: node-agent-account
        - name: CLIENT_ALLOWLIST
          valueFrom:
            configMapKeyRef:
              name: service-portal-config
              key: client-allowlist
        args:
        - "--listen-address=:8443"
        - "--tls-cert-file=/etc/service-portal-controller/certs/tls.crt"
        - "--tls-key-file=/etc/service-portal-controller/certs/tls.key"
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/service-portal-controller/certs
          readOnly: true
      volumes:
      - name: tls-certs
        secret:
          secretName: service-portal-controller-tls
---
apiVersion: v1
kind: Service
metadata:
  name: service-portal-controller
  namespace: service-portal-system
  labels:
    app: service-portal-controller
spec:
  selector:
    app: service-portal-controller
  ports:
  - name: https
    port: 8443
    targetPort: 8443
    protocol: TCP
