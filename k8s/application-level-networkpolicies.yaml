# NetworkPolicy for opted-in workload pods: restricts all outbound traffic
# to the service-portal proxy (TCP 8080) and cluster DNS (UDP/TCP 53).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workload-applevel-egress
spec:
  podSelector:
    matchLabels:
      portal.gke.io/enabled: "true"
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: service-portal
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
# NetworkPolicy for the service-portal proxy: allows ingress only from
# opted-in pods, and egress only to configured upstreams and cluster DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: service-portal-netpol
spec:
  podSelector:
    matchLabels:
      app: service-portal
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          portal.gke.io/enabled: "true"
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow egress to external upstreams (e.g. public cloud / external APIs)
  # while blocking internal cluster CIDRs and the link-local metadata server.
  # Customize CIDRs and ports to match your specific cluster and provider topology.
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 10.0.0.0/8        # Internal cluster/VPC CIDR
        - 172.16.0.0/12     # Internal cluster/pod CIDR
        - 192.168.0.0/16    # Internal cluster/service CIDR
        - 169.254.169.254/32 # Cloud metadata server
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
