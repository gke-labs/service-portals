apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: portalpolicies.portals.gke.io
spec:
  group: portals.gke.io
  names:
    kind: PortalPolicy
    listKind: PortalPolicyList
    plural: portalpolicies
    singular: portalpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - podSelector
            properties:
              podSelector:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              rules:
                type: array
                items:
                  type: object
                  required:
                  - host
                  properties:
                    host:
                      type: string
                      pattern: '^([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])(\.([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9\-]{0,61}[a-zA-Z0-9]))*$'
                    rewriteUrl:
                      type: string
                    authHeader:
                      type: string
                    secretRef:
                      type: object
                      required:
                      - name
                      - key
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                    cacheTTL:
                      type: string
              egress:
                type: object
                properties:
                  defaultAction:
                    type: string
                    enum:
                    - Deny
                    - Allow
                  allowCIDRs:
                    type: array
                    items:
                      type: string
                  allowPorts:
                    type: array
                    items:
                      type: integer
                  dns:
                    type: object
                    properties:
                      servers:
                        type: array
                        items:
                          type: string
                      allowMetadata:
                        type: boolean
              intercept:
                type: object
                properties:
                  ports:
                    type: array
                    items:
                      type: integer
              proxy:
                type: object
                properties:
                  image:
                    type: string
                  resources:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              selectedPods:
                type: integer
