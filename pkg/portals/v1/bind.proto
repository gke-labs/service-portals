syntax = "proto3";

package portals.v1;

option go_package = "github.com/gke-labs/service-portals/pkg/portals/v1;portalsv1";

// PodBindService manages the dynamic binding of sandbox pods to user identities
// and access policies. Called by sandbox claim controllers over authenticated gRPC.
service PodBindService {
  // Bind associates a pod UID with an identity and policy.
  rpc Bind(BindRequest) returns (BindResponse);

  // Unbind dissociates a pod UID, reverting it to fail-closed state.
  rpc Unbind(UnbindRequest) returns (UnbindResponse);

  // Get retrieves the current binding and status of a pod.
  rpc Get(GetRequest) returns (GetResponse);
}

message BindRequest {
  string pod_uid = 1;
  string identity = 2;
  string policy = 3;
}

message BindResponse {
  string pod_uid = 1;
  bool bound = 2;
}

message UnbindRequest {
  string pod_uid = 1;
}

message UnbindResponse {
  string pod_uid = 1;
  bool bound = 2;
}

message GetRequest {
  string pod_uid = 1;
}

message GetResponse {
  string pod_uid = 1;
  string namespace = 2;
  string name = 3;
  repeated string ips = 4;
  string identity = 5;
  string policy = 6;
  bool bound = 7;
}
